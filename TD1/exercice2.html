<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercice 2</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css"
    />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="map" style="height: 400px"></div>
    <script type="module">
      import { LeafletMap, TileLayer, Marker, Circle, Polygon } from "leaflet";
      // the map code goes here
      const map = new LeafletMap("map").setView([0, 0], 15);

      new TileLayer(
        "https://maps.stadia.com/tiles/stamen/watercolor/{z}/{x}/{y}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245",
        {
          maxZoom: 19,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        },
      ).addTo(map);

      // Recuperation de ma position
      var mylat;
      var mylong;
      var myprec;

      const positionOptions = {
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 0,
      };

      function currentPositionSuccess(pos) {
        var crd = pos.coords;
        mylat = crd.latitude;
        mylong = crd.longitude;
        myprec = crd.accuracy;
        map.setView([mylat, mylong], 15);
        const markermypos = new Marker([mylat, mylong]).addTo(map);
        const circlemypos = new Circle([mylat, mylong], {
          color: "purple",
          fillColor: "blue",
          fillOpacity: 0.3,
          radius: myprec,
        }).addTo(map);
      }

      function currentPositionError(err) {
        console.warn(`ERREUR (${err.code}): ${err.message}`);
      }

      navigator.geolocation.getCurrentPosition(
        currentPositionSuccess,
        currentPositionError,
        positionOptions,
      );

      // Triangle des bermudes

      const bermudes = new Polygon(
        [
          [32.3, -64.78],
          [25.79, -80.23],
          [18.47, -66.11],
        ],
        {
          color: "red",
        },
      ).addTo(map);

      const markernice = new Marker([43.696, 7.271]).addTo(map);
    </script>
  </body>
</html>
